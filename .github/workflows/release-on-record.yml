name: Release on record

# Merging a change whose changelog records a new version IS the release.
# Every push to main re-proves the check lane across every supported PHP
# version, and when the newest recorded version has no tag yet, this
# workflow creates the tag through the repository API and publishes the
# GitHub release itself - a tag created by a workflow token triggers no
# other workflow, so publication happens here. Runs are idempotent: an
# already-tagged, already-released version makes this a verification-only
# run. Packagist follows tags through its GitHub integration, so no
# registry credential ever enters this repository's workflows.

on:
  push:
    branches:
      - main

permissions:
  contents: read

# Serialized so two pushes cannot race past the tag-existence check; the
# later run then finds the tag and verifies instead of colliding.
concurrency:
  group: release-on-record
  cancel-in-progress: false

jobs:
  check:
    name: PHP ${{ matrix.php }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        php: ['8.5']
    steps:
      - name: Check out the pushed commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
          tools: composer:v2

      - name: Install the validated package toolchain
        run: |
          composer validate --strict
          composer install --no-interaction --prefer-dist
          composer audit --abandoned=fail

      - name: Run the complete package gate
        run: composer check

      - name: Verify the no-dev installed-package autoloader and the shipped example
        run: |
          composer install --no-interaction --prefer-dist --no-dev --classmap-authoritative
          composer autoload:smoke
          composer examples

  release:
    name: Release the recorded version
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Check out the pushed commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      # The newest release record is the FIRST second-level heading, so a
      # malformed record fails this run loudly instead of silently
      # releasing nothing or re-reading an older heading.
      - name: Read the newest recorded version
        id: record
        shell: bash
        run: |
          set -euo pipefail
          first="$(grep -m 1 -E '^## ' CHANGELOG.md || true)"
          if [ "$first" = "## Unreleased" ] || [ "$first" = "## [Unreleased]" ]; then
            first="$(grep -E '^## ' CHANGELOG.md | sed -n 2p)"
          fi
          if [ -z "$first" ]; then
            echo "::notice::CHANGELOG.md records no released version yet; nothing to release."
            echo "version=" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          version="$(sed -nE 's/^## \[?([0-9]+\.[0-9]+\.[0-9]+)\]?( .*)?$/\1/p' <<<"$first")"
          if [ -z "$version" ]; then
            echo "::error::The newest changelog heading does not parse as a release record: $first"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      # Probe publication before accepting an existing tag. A release that
      # already exists is an idempotent verification path; an unpublished
      # tag must identify this exact commit after its complete check matrix.
      - name: Check whether the GitHub release exists
        if: steps.record.outputs.version != ''
        id: publication
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.record.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          probe_status=0
          probe="$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/v$VERSION" 2>&1)" || probe_status=$?
          if [ "$probe_status" -eq 0 ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          elif grep -q 'HTTP 404' <<<"$probe"; then
            echo "exists=false" >> "$GITHUB_OUTPUT"
          else
            echo "$probe"
            echo "::error::Could not determine whether release v$VERSION exists."
            exit 1
          fi

      # Only a confirmed 404 means the tag is missing; any other probe
      # failure stops the run rather than colliding with an existing tag.
      - name: Create the version tag when it is missing
        if: steps.record.outputs.version != ''
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_EXISTS: ${{ steps.publication.outputs.exists }}
          VERSION: ${{ steps.record.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          probe_status=0
          probe="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/v$VERSION" 2>&1)" || probe_status=$?
          if [ "$probe_status" -eq 0 ]; then
            tag_type="$(jq -r '.object.type' <<<"$probe")"
            tag_sha="$(jq -r '.object.sha' <<<"$probe")"
            if [ "$tag_type" != commit ]; then
              echo "::error::Tag v$VERSION points to $tag_type $tag_sha instead of a release commit."
              exit 1
            fi
            if ! git merge-base --is-ancestor "$tag_sha" "$GITHUB_SHA"; then
              echo "::error::Tag v$VERSION points outside the pushed main history: $tag_sha."
              exit 1
            fi
            tagged_heading="$(git show "$tag_sha:CHANGELOG.md" | grep -m 1 -E '^## ')"
            tagged_version="$(sed -nE 's/^## \[?([0-9]+\.[0-9]+\.[0-9]+)\]?( .*)?$/\1/p' <<<"$tagged_heading")"
            if [ "$tagged_version" != "$VERSION" ]; then
              echo "::error::Tag v$VERSION targets a commit whose newest release record is $tagged_version."
              exit 1
            fi
            if [ "$RELEASE_EXISTS" != true ] && [ "$tag_sha" != "$GITHUB_SHA" ]; then
              echo "::error::Unpublished tag v$VERSION points to $tag_sha, not the tested commit $GITHUB_SHA."
              exit 1
            fi
            echo "Verified tag v$VERSION at release commit $tag_sha."
          elif grep -q 'HTTP 404' <<<"$probe"; then
            if [ "$RELEASE_EXISTS" = true ]; then
              echo "::error::Release v$VERSION exists without its version tag."
              exit 1
            fi
            gh api "repos/$GITHUB_REPOSITORY/git/refs" \
              --field ref="refs/tags/v$VERSION" \
              --field sha="$GITHUB_SHA"
            echo "Created tag v$VERSION at release commit $GITHUB_SHA."
          else
            echo "$probe"
            echo "::error::Could not determine whether tag v$VERSION exists."
            exit 1
          fi

      - name: Publish the GitHub release when it is missing
        if: steps.record.outputs.version != '' && steps.publication.outputs.exists != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.record.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          gh release create "v$VERSION" \
            --verify-tag \
            --title "v$VERSION" \
            --notes "Storage-neutral transaction port of the Kumwe family. Changelog: CHANGELOG.md section $VERSION."
